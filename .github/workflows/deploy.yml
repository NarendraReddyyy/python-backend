name: Build → Push → Deploy (Compose, immutable tag)

on:
  push:
    branches: [ master ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get latest image tag
        id: get_tag
        run: |
          IMAGE=${{ secrets.IMAGE_NAME }}
          echo "Checking latest tag for $IMAGE..."
          # Fetch tags from Docker Hub API
          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${IMAGE}/tags/?page_size=100" | jq -r '.results[].name' | grep '^v[0-9]\+$' | sort -V)
          if [ -z "$TAGS" ]; then
            NEW_TAG="v1"
          else
            LAST_TAG=$(echo "$TAGS" | tail -n 1)
            LAST_NUM=${LAST_TAG#v}
            NEW_TAG="v$((LAST_NUM + 1))"
          fi
          echo "New tag will be: $NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.IMAGE_NAME }}:${{ steps.get_tag.outputs.tag }}

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /your/project/path
            docker-compose pull
            docker-compose up -d
